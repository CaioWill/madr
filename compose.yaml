services:
  madr_database:
    image: postgres
    volumes:
      - pgdata:/var/lib/postgresql/
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: madr
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"

  madr_app:
    image: madr_app
    build: .
    entrypoint: ./entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      - madr_database
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@madr_database:5432/madr

volumes:
  pgdata: